<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="icon" type="image/x-icon" href="public/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Bolinha do cursor -->
<div id="cur"></div>
<!-- Container -->
<div id="cur-ring"></div>
<div id="wander"></div>

<!-- Botões fixos -->
<div id="fixed-btns">
  <button id="dbtn">[ modo : claro ]</button>
  <button id="abtn">[ som : off ]</button>
</div>

<button id="back-top">[ ↑ topo ]</button>
<div id="outer">
    <!-- Banner principal -->
    <header id="site-header">
      <div class="deco-float df1" style="--rot:-8deg;">✦</div>
      <div class="deco-float df2" style="--rot:6deg;">◌</div>
      <div class="deco-float df3" style="--rot:-4deg;">⋆</div>
      <div class="deco-float df4" style="--rot:10deg;">✧</div>
      <div class="banner-box">
        <span class="banner-sym" id="d-siteSym"></span>
        <span class="banner-title" id="d-siteTitle"></span>
        <span class="banner-sub" id="d-siteSub"></span>
      </div>
      <div class="badges-row" id="d-badges"></div>
    </header>

    <!-- Navegação -->
    <nav id="nav">
      <button class="nlink on" data-t="inicio">inicio</button>
      <button class="nlink" data-t="sobre">sobre</button>
      <button class="nlink" data-t="projetos">projetos</button>
      <button class="nlink" data-t="blog">blog</button>
      <button class="nlink" data-t="filosofia">filosofia</button>
      <button class="nlink" data-t="stack">stack</button>
      <button class="nlink" data-t="contato">contato</button>
    </nav>
    <div class="marquee-wrap"><span class="marquee-inner" id="d-marquee"></span></div>

    <!-- Seções -->
    <section id="inicio" class="sec on">
      <div class="welcome-box">
        <p style="font-family:var(--vt);font-size:1rem;color:var(--lilac);letter-spacing:0.15em;margin-bottom:6px;">» agora entrando em bydan.com.br...</p>
        <div class="tw-line"><span id="tw-text"></span><span id="tw-cur">_</span></div>
      </div>
      <div class="inicio-grid" id="d-novidades"></div>
      <div class="div">· · transmissões recentes · ·</div>
      <div id="d-recent-posts"></div>
      <div style="text-align:center;margin:20px 0;">
        <a class="read-more" onclick="go('blog');return false;" href="#">[ ver todas as entradas ]</a>
      </div>
      <div class="div">✦</div>
    </section>
    <section id="sobre" class="sec">
      <div class="sec-head">sobre <span>// arquivo pessoal</span></div>
      <div class="sobre-layout">
        <div class="avatar-box" id="d-avatar"></div>
        <div class="sobre-text" id="d-sobre-text"></div>
      </div>
      <div class="div">✦</div>
    </section>
    <section id="projetos" class="sec">
      <div class="sec-head">projetos <span>// estruturas digitais</span></div>
      <div id="proj-tag-filter" class="tag-filter"></div>
      <div class="proj-grid" id="d-proj-grid"></div>
      <div class="div">✦</div>
    </section>
    <section id="blog" class="sec">
      <div class="sec-head">blog <span>// registros</span></div>
      <div id="search-wrap">
        <input type="search" id="search-input" placeholder="// buscar posts..." oninput="onSearch(this.value)">
        <button id="search-clear" onclick="clearSearch()">✕</button>
      </div>
      <div id="blog-tag-filter" class="tag-filter"></div>
      <div id="search-results-count"></div>
      <div id="d-blog-posts"></div>
      <div class="div">✦</div>
    </section>
    <div id="post-view">
      <div class="post-view-controls">
        <a class="back-btn" onclick="closePost();return false;" href="#">[ ← voltar ]</a>
        <button class="reader-btn" id="reader-btn" onclick="toggleReader()">[ leitura ]</button>
      </div>
      <div class="post-content" id="post-view-content"></div>
      <div class="post-nav" id="post-nav"></div>
    </div>
    <section id="filosofia" class="sec">
      <div class="sec-head">filosofia <span>// manifesto</span></div>
      <div class="filo-box">
        <span class="filo-quote" id="d-filo-quote"></span>
        <div id="d-filo-paras"></div>
        <span class="sym-deco">✦ ◌ ✧ ◌ ✦</span>
      </div>
      <div class="div">✦</div>
    </section>
    <section id="stack" class="sec">
      <div class="sec-head">stack <span>// ferramentas</span></div>
      <div class="stack-table" id="d-stack"></div>
      <div class="div">✦</div>
    </section>
    <section id="contato" class="sec">
      <div class="sec-head">contato <span>// sinais</span></div>
      <div class="contato-box">
        <span class="contato-note" id="d-contato-note"></span>
        <div id="d-contato-links"></div>
      </div>
      <div class="div">✦</div>
    </section>
    <footer id="site-footer">
      <span class="footer-sym" id="d-footerSym"></span>
      <div class="footer-info" id="d-footerInfo"></div>
      <div class="footer-links">
        <a href="/feed.xml">rss</a>
        <a href="admin/index.html" style="opacity:0;font-size:0.1px;color:transparent;pointer-events:auto;" title="·">·</a>
      </div>
    </footer>
</div>
<script src="js/jquery-4.0.0.min.js"></script>
<script src="js/scripts/main.js"></script>
<script src="app.js"></script>
</body>
</html>
